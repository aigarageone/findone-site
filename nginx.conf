server {
    listen 80;
    server_name fin.remind-ai.space findone.xyz www.findone.xyz;

    root /var/www/findone-landing;
    index index.html;

    # Redirect www to apex
    if ($host = "www.findone.xyz") {
        return 301 https://findone.xyz$request_uri;
    }

    # 301 redirects from old .html URLs to new slug-based structure
    rewrite ^/index\.html$ / permanent;
    rewrite ^/findone\.html$ / permanent;
    rewrite ^/blog\.html$ /blog/ permanent;
    rewrite ^/authors\.html$ /blog/avtory/ permanent;
    rewrite ^/privacy\.html$ /privacy/ permanent;
    rewrite ^/terms\.html$ /terms/ permanent;
    rewrite ^/article-budget-15000\.html$ /blog/yak-zhyty-na-15000-grn/ permanent;
    rewrite ^/article-ai-categorization\.html$ /blog/ai-katehoryzatsiya/ permanent;

    # topic.html?t=<topic> — redirect to new topic URLs (UK default)
    if ($arg_t = "budgeting") { return 301 /blog/tema/budzhetuvannya/; }
    if ($arg_t = "ai") { return 301 /blog/tema/ai-u-finansakh/; }
    if ($arg_t = "saving") { return 301 /blog/tema/zaoshchadzhennya/; }
    if ($arg_t = "product") { return 301 /blog/tema/produkt/; }
    if ($arg_t = "stories") { return 301 /blog/tema/istoriyi/; }
    rewrite ^/topic\.html$ /blog/ permanent;

    # Clean URLs: try exact file, then directory index, then SPA fallback
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Static asset caching
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Sitemap and robots
    location = /sitemap.xml { try_files $uri =404; }
    location = /sitemap-uk.xml { try_files $uri =404; }
    location = /sitemap-en.xml { try_files $uri =404; }
    location = /sitemap-es.xml { try_files $uri =404; }
    location = /robots.txt { try_files $uri =404; }
}
